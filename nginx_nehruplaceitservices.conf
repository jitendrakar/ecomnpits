# ==============================================================================
# Dedicated Nginx Configuration for nehruplaceitservices.com
# Multi-Site Isolation: Routes traffic exclusively for this domain.
# Does NOT interfere with other existing websites hosted on the same VPS.
# ==============================================================================

# HTTP Server Block - Domain-specific redirect & Let's Encrypt validation
server {
    listen 80;
    listen [::]:80;
    server_name nehruplaceitservices.com www.nehruplaceitservices.com;

    # Certbot ACME Challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nehruplaceitservices.com www.nehruplaceitservices.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/nehruplaceitservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nehruplaceitservices.com/privkey.pem;

    # Recommended SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_ecomnpits:10m;
    ssl_session_tickets off;

    # Domain-Scoped Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Files location
    location /static/ {
        alias /home/ecomnpits/static_collected/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Uploaded Media location
    location /media/ {
        alias /home/ecomnpits/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Health Check Proxy
    location /health/ {
        proxy_pass http://127.0.0.1:8001/health/;
        proxy_set_header Host $host;
        access_log off;
    }

    # Django App Reverse Proxy (Unique internal port 8001)
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
