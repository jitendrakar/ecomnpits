{% load static %}
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'core:home' %}">
            {% if site_settings.logo %}
                <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.company_name }}" height="45" width="45" class="rounded-circle logo-img me-2">
            {% else %}
                <img src="{% static 'images/logo_circle.png' %}" alt="{{ site_settings.company_name }}" height="45" width="45" class="rounded-circle logo-img me-2">
            {% endif %}
            <div>
                <span class="brand-title d-block leading-tight fw-bold text-white">NEHRU PLACE IT SERVICES</span>
                <small class="text-cyan d-block" style="font-size: 0.65rem; letter-spacing: 2px; font-weight: 600;">TECHNOLOGY & PRODUCTS</small>
            </div>
        </a>

        <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-1">
                <li class="nav-item"><a class="nav-link text-nowrap" href="{% url 'core:home' %}"><i class="bi bi-house-door me-1"></i> Home</a></li>
                <li class="nav-item"><a class="nav-link text-nowrap" href="{% url 'products:product_list' %}"><i class="bi bi-laptop me-1"></i> Products</a></li>
                <li class="nav-item"><a class="nav-link text-nowrap" href="{% url 'services:service_list' %}"><i class="bi bi-gear-fill me-1"></i> Services</a></li>
                <li class="nav-item"><a class="nav-link text-nowrap" href="{% url 'core:about' %}"><i class="bi bi-info-circle me-1"></i> About</a></li>
                <li class="nav-item"><a class="nav-link text-nowrap" href="{% url 'core:contact' %}"><i class="bi bi-envelope me-1"></i> Contact</a></li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <!-- Compact Phone Call Button -->
                <a href="tel:{{ site_settings.phone }}" class="btn btn-sm btn-outline-cyan rounded-circle d-flex align-items-center justify-content-center" style="width: 36px; height: 36px; flex-shrink: 0;" title="Call Us: {{ site_settings.phone }}">
                    <i class="bi bi-telephone-fill"></i>
                </a>

                <!-- Get Quote Direct Button -->
                <a href="{% url 'core:contact' %}" class="btn btn-sm btn-cyan d-flex align-items-center gap-1 rounded-pill px-3 fw-bold">
                    <i class="bi bi-chat-quote-fill me-1"></i> Get Quote
                </a>

                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" class="btn btn-sm btn-outline-cyan d-flex align-items-center gap-1 rounded-pill px-3" type="button" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
                    <i class="bi bi-moon-stars-fill theme-icon-dark"></i>
                    <i class="bi bi-sun-fill theme-icon-light d-none"></i>
                    <span class="small theme-text-label">Light</span>
                </button>
            </div>
        </div>
    </div>
</nav>
