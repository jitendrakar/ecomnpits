{% extends 'base.html' %}
{% load static %}

{% block title %}404 - Node Not Found | {{ site_settings.company_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-gradient mb-0">404</h1>
        <h3 class="fw-bold text-white mb-3">SYSTEM NODE NOT FOUND</h3>
        <p class="text-muted mb-4">The requested page URL could not be located on our servers.</p>
        <a href="{% url 'core:home' %}" class="btn btn-cyan btn-lg">
            <i class="bi bi-house me-2"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
